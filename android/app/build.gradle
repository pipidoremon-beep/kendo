plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.kendo.app'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.kendo.app'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    // Chu ky co dinh: moi lan GitHub build ra app deu cung chu ky -> cai de duoc
    signingConfigs {
        debug {
            storeFile file('kendo.keystore')
            storePassword 'kendo123'
            keyAlias 'kendo'
            keyPassword 'kendo123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
